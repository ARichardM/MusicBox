name: Publicar instalador Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Validar versión consecutiva
        run: python scripts/check_version.py
      - name: Validar secretos de compilación
        shell: pwsh
        env:
          OAUTH_CONFIG: ${{ secrets.DESKTOP_OAUTH_CLIENT_JSON_BASE64 }}
          FIREBASE_CONFIG: ${{ secrets.DESKTOP_FIREBASE_CONFIG_BASE64 }}
        run: |
          if (-not $env:OAUTH_CONFIG) { throw "Falta DESKTOP_OAUTH_CLIENT_JSON_BASE64" }
          if (-not $env:FIREBASE_CONFIG) { throw "Falta DESKTOP_FIREBASE_CONFIG_BASE64" }
      - name: Preparar configuración pública
        shell: pwsh
        env:
          OAUTH_CONFIG: ${{ secrets.DESKTOP_OAUTH_CLIENT_JSON_BASE64 }}
          FIREBASE_CONFIG: ${{ secrets.DESKTOP_FIREBASE_CONFIG_BASE64 }}
        run: |
          [IO.File]::WriteAllBytes("desktop_oauth_client.json", [Convert]::FromBase64String($env:OAUTH_CONFIG))
          [IO.File]::WriteAllBytes("desktop_firebase_config.json", [Convert]::FromBase64String($env:FIREBASE_CONFIG))
          $oauth = Get-Content "desktop_oauth_client.json" -Raw | ConvertFrom-Json
          if (-not $oauth.installed.client_id) { throw "El cliente OAuth no es de tipo escritorio" }
          $firebase = Get-Content "desktop_firebase_config.json" -Raw | ConvertFrom-Json
          if (-not $firebase.project_id -or -not $firebase.api_key) { throw "La configuración Firebase de escritorio está incompleta" }
      - name: Instalar herramientas verificadas
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/desktop/requirements.txt pyinstaller==6.16.0
          winget install --id Gyan.FFmpeg.Essentials --exact --silent --accept-package-agreements --accept-source-agreements
          $ffmpeg = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Filter ffmpeg.exe -Recurse -File | Select-Object -First 1
          if (-not $ffmpeg) { throw "WinGet instaló FFmpeg, pero no se encontró ffmpeg.exe" }
          Copy-Item $ffmpeg.FullName ffmpeg.exe
      - name: Probar escritorio antes de empaquetar
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path "apps/desktop").Path
          $env:PYTHONIOENCODING = "utf-8"
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m unittest discover -s tests/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compilar ejecutable
        run: pyinstaller --noconfirm --clean packaging/windows/musicbox.spec
      - name: Probar ejecutable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/MusicBox/MusicBox.exe" -ArgumentList "--version" -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "MusicBox.exe no superó la prueba" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $process = Start-Process -FilePath "dist/MusicBox/MusicBox.exe" -ArgumentList "--smoke-test" -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw "La prueba aislada de interfaz no terminó" }
          if ($process.ExitCode -ne 0) { throw "MusicBox.exe no pudo cargar su interfaz QML" }
      - name: Compilar instalador
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "packaging\windows\MusicBox.iss"
      - name: Empaquetar versión portable
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/MusicBox" -DestinationPath "dist/installer/MusicBox-Windows-Portable.zip" -CompressionLevel Optimal
      - name: Generar sumas SHA-256
        shell: pwsh
        run: |
          foreach ($name in "MusicBox-Windows-Setup.exe", "MusicBox-Windows-Portable.zip") {
            $hash = (Get-FileHash "dist/installer/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content "dist/installer/$name.sha256" -Encoding ascii
          }
      - name: Preparar notas de la versión
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{p = index($0, "## " v " ") == 1; next} p' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "Falta la sección $version en CHANGELOG.md"; exit 1; }
      - name: Adjuntar a GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/installer/MusicBox-Windows-Setup.exe
            dist/installer/MusicBox-Windows-Setup.exe.sha256
            dist/installer/MusicBox-Windows-Portable.zip
            dist/installer/MusicBox-Windows-Portable.zip.sha256
          body_path: release-notes.md
          fail_on_unmatched_files: true
          draft: true
