name: Publicar APK Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validar versión consecutiva
        run: python3 ../../scripts/check_version.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Validar secretos de publicación
        shell: bash
        env:
          GOOGLE_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$GOOGLE_CONFIG" || { echo "Falta GOOGLE_SERVICES_JSON_BASE64"; exit 1; }
          test -n "$KEYSTORE" || { echo "Falta ANDROID_KEYSTORE_BASE64"; exit 1; }
      - name: Preparar credenciales de compilación
        shell: bash
        env:
          GOOGLE_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$GOOGLE_CONFIG" | base64 --decode > app/google-services.json
          echo "$KEYSTORE" | base64 --decode > app/musicbox-release.jks
      - name: Probar y compilar APK firmado
        env:
          MUSICBOX_KEYSTORE_PATH: musicbox-release.jks
          MUSICBOX_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MUSICBOX_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MUSICBOX_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testPreviewUnitTest lintRelease assembleRelease --stacktrace
      - name: Preparar descarga
        shell: bash
        run: cp app/build/outputs/apk/release/app-release.apk ../../MusicBox-Android.apk
      - name: Generar suma SHA-256
        shell: bash
        working-directory: ${{ github.workspace }}
        run: sha256sum MusicBox-Android.apk > MusicBox-Android.apk.sha256
      - name: Preparar notas de la versión
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{p = index($0, "## " v " ") == 1; next} p' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "Falta la sección $version en CHANGELOG.md"; exit 1; }
      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MusicBox-Android.apk
            MusicBox-Android.apk.sha256
          body_path: release-notes.md
          fail_on_unmatched_files: true
          draft: true
