name: Desktop CI

on:
  push:
    branches: [main]
    paths: ["apps/desktop/**", "tests/desktop/**", ".github/workflows/desktop-ci.yml"]
  pull_request:
    paths: ["apps/desktop/**", "tests/desktop/**", ".github/workflows/desktop-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/desktop/requirements.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/desktop/requirements.txt pip-audit
      - name: Auditar dependencias
        run: python -m pip_audit -r apps/desktop/requirements.txt
      - name: Validar código Python
        run: python -m compileall -q apps/desktop
      - name: Ejecutar pruebas
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path "apps/desktop").Path
          $env:PYTHONIOENCODING = "utf-8"
          python -m unittest discover -s tests/desktop -v *> test-output.txt
          $code = $LASTEXITCODE
          Get-Content test-output.txt -Encoding utf8 | Select-Object -Last 150
          if ($code -ne 0) {
            $lines = Get-Content test-output.txt -Encoding utf8
            $start = ($lines | Select-String -Pattern '^(FAIL|ERROR):' | Select-Object -First 1).LineNumber
            if (-not $start) { $start = [Math]::Max(1, $lines.Count - 25) }
            $detail = ($lines[($start - 1)..([Math]::Min($lines.Count - 1, $start + 28))] -join ' | ')
            Write-Host "::error title=Pruebas de escritorio::$detail"
            exit $code
          }
