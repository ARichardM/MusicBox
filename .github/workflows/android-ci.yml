name: Android CI

on:
  push:
    branches: [main]
    paths: ["apps/android/**", ".github/workflows/android-ci.yml"]
  pull_request:
    paths: ["apps/android/**", ".github/workflows/android-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Crear configuración Firebase de CI
        shell: bash
        run: |
          cat > app/google-services.json <<'JSON'
          {"project_info":{"project_number":"123456789","project_id":"musicbox-ci","storage_bucket":"musicbox-ci.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:0000000000000000","android_client_info":{"package_name":"cl.arichard.descargador.pruebas"}},"oauth_client":[{"client_id":"123456789-ci.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"AIzaSyCIPlaceholderKeyNotForProduction000"}],"services":{"appinvite_service":{"other_platform_oauth_client":[{"client_id":"123456789-ci.apps.googleusercontent.com","client_type":3}]}}}],"configuration_version":"1"}
          JSON
      - name: Pruebas y APK de preview
        run: ./gradlew testPreviewUnitTest assemblePreview lintPreview --stacktrace
      - name: Publicar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: MusicBox-preview-${{ github.sha }}
          path: apps/android/app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error
          retention-days: 14
