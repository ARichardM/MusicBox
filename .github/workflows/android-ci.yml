name: Android CI

on:
  push:
    branches: [main]
    paths: ["apps/android/**", ".github/workflows/android-ci.yml"]
  pull_request:
    paths: ["apps/android/**", ".github/workflows/android-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Pruebas y APK de verificación aislada
        run: ./gradlew testVerificationUnitTest assembleVerification assembleVerificationAndroidTest lintVerification --stacktrace --warning-mode all
      - name: Conservar informes de pruebas y lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MusicBox-android-reports-${{ github.sha }}
          path: |
            apps/android/app/build/reports/
            apps/android/app/build/test-results/
            apps/android/build/reports/problems/
          if-no-files-found: warn
          retention-days: 14
      - name: Publicar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: MusicBox-verification-${{ github.sha }}
          path: apps/android/app/build/outputs/apk/verification/app-verification.apk
          if-no-files-found: error
          retention-days: 14
